[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["product_docs/**"]

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

# The Android app is too big for the repo (GitHub refuses files over 100 MB),
# so the APK lives on a GitHub release. This keeps the download link on
# oxx-ai.com. For a new version, follow "Release a new Android version" in CLAUDE.md.
[[redirects]]
  from = "/downloads/oxx-report-android.apk"
  to = "https://github.com/agoodhead/OxxWebsite/releases/download/android-v0.6.3/oxx-report-0.6.3.apk"
  status = 302
  force = true

# The whole repo is published (publish = "."), so internal notes and tests
# would otherwise be public. These answer 404 instead.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# Browsers keep assets for a year without re-checking.
# When replacing an image or video, save it under a new filename.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
